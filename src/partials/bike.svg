<svg class="bike-scene" viewBox="0 0 900 460" role="img" aria-label="{{gar.sceneAlt}}">
        <defs>
          <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f1"/><stop offset=".38" stop-color="#b9b5ab"/><stop offset=".5" stop-color="#55534e"/><stop offset=".62" stop-color="#9c988f"/><stop offset="1" stop-color="#e6e2d8"/></linearGradient>
          <linearGradient id="chromeH" x1="0" x2="1"><stop offset="0" stop-color="#5f5c56"/><stop offset=".45" stop-color="#f5f1e8"/><stop offset=".6" stop-color="#8f8b83"/><stop offset="1" stop-color="#3f3d39"/></linearGradient>
          <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a29"/><stop offset=".35" stop-color="#0d0d0d"/><stop offset="1" stop-color="#050505"/></linearGradient>
          <radialGradient id="tankShine" cx=".38" cy=".25" r=".75"><stop offset="0" stop-color="#4a4a48"/><stop offset=".35" stop-color="#151514"/><stop offset="1" stop-color="#040404"/></radialGradient>
          <radialGradient id="floorLight" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="rgba(236,232,223,.16)"/><stop offset="1" stop-color="rgba(236,232,223,0)"/></radialGradient>
          <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="rgba(0,0,0,.85)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/></radialGradient>
          <linearGradient id="fuel" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#4b2a6e"/><stop offset=".25" stop-color="#1f5d7a"/><stop offset=".45" stop-color="#2f7a4a"/><stop offset=".65" stop-color="#8a7a24"/><stop offset=".85" stop-color="#7a2f5a"/><stop offset="1" stop-color="#3a2a6e"/>
          </linearGradient>
          <radialGradient id="puddleMask" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
          <mask id="pm"><ellipse cx="455" cy="428" rx="170" ry="16" fill="url(#puddleMask)"/></mask>
          <radialGradient id="hl" cx="0" cy=".5" r="1"><stop offset="0" stop-color="rgba(255,250,230,.75)"/><stop offset=".4" stop-color="rgba(255,248,220,.25)"/><stop offset="1" stop-color="rgba(255,248,220,0)"/></radialGradient>
        </defs>

        <!-- floor, shadow, fuel puddle -->
        <ellipse cx="450" cy="425" rx="420" ry="34" fill="url(#floorLight)"/>
        <line x1="0" y1="420" x2="900" y2="420" stroke="#2c2b29" stroke-width="2"/>
        <ellipse cx="460" cy="421" rx="330" ry="12" fill="url(#shadow)"/>
        <g class="puddle" mask="url(#pm)">
          <ellipse cx="455" cy="428" rx="170" ry="16" fill="#0a0a0a"/>
          <ellipse class="sheen" cx="455" cy="428" rx="170" ry="16" fill="url(#fuel)" opacity=".55"/>
          <ellipse class="ripple" cx="452" cy="427" rx="4" ry="1" fill="none" stroke="#e8e4dc" stroke-width="1"/>
          <ellipse class="ripple r2" cx="452" cy="427" rx="4" ry="1" fill="none" stroke="#e8e4dc" stroke-width="1"/>
        </g>
        <circle class="drip" cx="452" cy="372" r="3.2" fill="#6b7a3a"/>
        <path class="beam-hl" d="M700 205 L900 120 L900 300 Z" fill="url(#hl)" opacity="0"/>

        <g class="bike" id="bike">
          <!-- REAR WHEEL -->
          <g class="tire"><circle cx="205" cy="326" r="82" fill="none" stroke="#0c0c0c" stroke-width="27"/><circle cx="205" cy="326" r="82" fill="none" stroke="#1c1c1b" stroke-width="22" stroke-dasharray="4 6"/><circle cx="205" cy="326" r="95" fill="none" stroke="#33322f" stroke-width="1.2"/><circle cx="205" cy="326" r="69" fill="none" stroke="#2a2927" stroke-width="1"/></g>
          <g class="wheel rear" style="transform-origin:205px 326px">
            <circle cx="205" cy="326" r="62" fill="none" stroke="url(#chrome)" stroke-width="5"/>
            <g stroke="#b3afa6" stroke-width="1.1" id="spokesR"></g>
            <circle cx="205" cy="326" r="30" fill="none" stroke="#4d4b47" stroke-width="7"/>
            <circle cx="205" cy="326" r="16" fill="#0a0a0a" stroke="url(#chrome)" stroke-width="3"/>
            <circle cx="205" cy="326" r="5" fill="#d9d5cc"/>
          </g>
          <!-- FRONT WHEEL -->
          <g class="tire"><circle cx="715" cy="332" r="78" fill="none" stroke="#0c0c0c" stroke-width="21"/><circle cx="715" cy="332" r="78" fill="none" stroke="#1c1c1b" stroke-width="16" stroke-dasharray="4 6"/><circle cx="715" cy="332" r="88" fill="none" stroke="#33322f" stroke-width="1.2"/></g>
          <g class="wheel front" style="transform-origin:715px 332px">
            <circle cx="715" cy="332" r="62" fill="none" stroke="url(#chrome)" stroke-width="5"/>
            <g stroke="#b3afa6" stroke-width="1.1" id="spokesF"></g>
            <circle cx="715" cy="332" r="38" fill="none" stroke="#5b5953" stroke-width="2"/>
            <circle cx="715" cy="332" r="14" fill="#0a0a0a" stroke="url(#chrome)" stroke-width="3"/>
          </g>

          <!-- REAR FRAME + SWINGARM -->
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M335 345 L205 326" stroke="#121212" stroke-width="12"/>
            <path d="M335 341 L205 322" stroke="#4a4844" stroke-width="1.5"/>
            <path d="M300 240 L232 300 L205 326" stroke="#121212" stroke-width="8"/>
            <path d="M652 212 C642 285 612 345 565 372 L395 378 C362 378 340 362 326 344" stroke="#121212" stroke-width="9"/>
            <path d="M648 198 L470 214 L300 240" stroke="#121212" stroke-width="10"/>
          </g>

          <!-- REAR FENDER + TAIL LIGHT -->
          <path d="M106.5 343.4 A100 100 0 0 1 255 239.4 L248 251.5 A86 86 0 0 0 120.3 340.9 Z" fill="url(#paint)" stroke="#55534e" stroke-width="1.2"/>
          <path d="M118 318 A90 90 0 0 1 230 248" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.6"/>
          <rect class="tail" x="100" y="296" width="18" height="9" rx="3" fill="#5a0b08" transform="rotate(-20 109 300)"/>

          <!-- PRIMARY + TRANSMISSION -->
          <rect x="392" y="298" width="52" height="56" rx="8" fill="#101010" stroke="#3a3936" stroke-width="1.5"/>
          <ellipse cx="365" cy="350" rx="60" ry="29" fill="#0e0e0e" stroke="url(#chrome)" stroke-width="3"/>
          <ellipse cx="365" cy="350" rx="44" ry="18" fill="none" stroke="#4d4b47" stroke-width="1.2"/>
          <circle cx="382" cy="352" r="13" fill="#141414" stroke="url(#chrome)" stroke-width="2.5"/>

          <!-- ENGINE (45° V-twin) -->
          <g class="engine">
            <ellipse cx="470" cy="342" rx="64" ry="36" fill="#0c0c0c" stroke="url(#chrome)" stroke-width="2.5"/>
            <circle cx="520" cy="348" r="19" fill="#151515" stroke="url(#chrome)" stroke-width="3"/>
            <g transform="rotate(-24 432 276)">
              <rect x="408" y="232" width="48" height="88" rx="6" fill="#121212" stroke="url(#chrome)" stroke-width="2.2"/>
              <g stroke="#7a766e" stroke-width="2.2"><line x1="402" y1="246" x2="462" y2="246"/><line x1="402" y1="257" x2="462" y2="257"/><line x1="402" y1="268" x2="462" y2="268"/><line x1="402" y1="279" x2="462" y2="279"/><line x1="402" y1="290" x2="462" y2="290"/><line x1="402" y1="301" x2="462" y2="301"/></g>
              <rect x="402" y="214" width="60" height="24" rx="6" fill="#1a1a1a" stroke="url(#chrome)" stroke-width="2.2"/>
            </g>
            <g transform="rotate(24 508 276)">
              <rect x="484" y="232" width="48" height="88" rx="6" fill="#121212" stroke="url(#chrome)" stroke-width="2.2"/>
              <g stroke="#7a766e" stroke-width="2.2"><line x1="478" y1="246" x2="538" y2="246"/><line x1="478" y1="257" x2="538" y2="257"/><line x1="478" y1="268" x2="538" y2="268"/><line x1="478" y1="279" x2="538" y2="279"/><line x1="478" y1="290" x2="538" y2="290"/><line x1="478" y1="301" x2="538" y2="301"/></g>
              <rect x="478" y="214" width="60" height="24" rx="6" fill="#1a1a1a" stroke="url(#chrome)" stroke-width="2.2"/>
            </g>
            <circle cx="470" cy="268" r="27" fill="#0f0f0f" stroke="url(#chrome)" stroke-width="3.5"/>
            <circle cx="470" cy="268" r="18" fill="none" stroke="#9c988f" stroke-width="1.2"/>
            <image href="{{@base}}assets/img/mark-256.png" x="457" y="255" width="26" height="26" opacity=".9"/>
          </g>

          <!-- EXHAUST (shotgun duals) -->
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M532 252 C566 300 548 364 502 386 L160 388" stroke="#070707" stroke-width="15"/>
            <path d="M532 252 C566 300 548 364 502 386 L160 388" stroke="url(#chrome)" stroke-width="10"/>
            <path d="M418 254 C396 300 384 344 360 368 L172 366" stroke="#070707" stroke-width="15"/>
            <path d="M418 254 C396 300 384 344 360 368 L172 366" stroke="url(#chrome)" stroke-width="10"/>
            <path d="M330 388 L150 388" stroke="url(#chrome)" stroke-width="17"/>
            <path d="M318 366 L162 364" stroke="url(#chrome)" stroke-width="15"/>
            <ellipse cx="146" cy="388" rx="3" ry="8" fill="#050505"/>
            <ellipse cx="158" cy="364" rx="3" ry="7" fill="#050505"/>
            <path d="M200 381 L320 381 M210 359 L310 359" stroke="rgba(255,255,255,.55)" stroke-width="1.4"/>
          </g>

          <!-- SEAT -->
          <path d="M298 238 C316 214 360 207 404 210 C434 212 456 214 478 217 L472 232 C432 234 362 242 300 250 Z" fill="#0d0c0b" stroke="#3a3936" stroke-width="1.5"/>
          <path d="M318 222 C350 214 400 213 450 216" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.5"/>

          <!-- TANK -->
          <path d="M470 216 C462 182 500 155 568 151 C620 148 650 166 657 188 C651 206 622 215 582 217 Z" fill="url(#tankShine)" stroke="#6d6a64" stroke-width="1.4"/>
          <path d="M505 168 C540 157 590 156 628 170" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M520 205 C560 208 600 206 635 197" fill="none" stroke="#9c988f" stroke-width="1.4"/>
          <circle cx="592" cy="153" r="6" fill="#0a0a0a" stroke="url(#chrome)" stroke-width="2"/>

          <!-- FORK -->
          <g stroke-linecap="round">
            <line x1="648" y1="182" x2="690" y2="278" stroke="#3d3b37" stroke-width="10"/>
            <line x1="640" y1="180" x2="684" y2="282" stroke="url(#chromeH)" stroke-width="12"/>
            <line x1="684" y1="280" x2="712" y2="334" stroke="#121212" stroke-width="16"/>
            <line x1="684" y1="280" x2="712" y2="334" stroke="#4a4844" stroke-width="2"/>
          </g>
          <rect x="628" y="170" width="34" height="14" rx="4" fill="#161616" stroke="url(#chrome)" stroke-width="2" transform="rotate(24 645 177)"/>

          <!-- FRONT FENDER -->
          <path d="M628.5 300.5 A92 92 0 0 1 801.5 300.5 L790.2 304.6 A80 80 0 0 0 639.8 304.6 Z" fill="url(#paint)" stroke="#55534e" stroke-width="1.2"/>

          <!-- BARS, MIRROR -->
          <path d="M642 172 C636 152 628 140 618 132 C604 126 590 124 578 124" fill="none" stroke="url(#chrome)" stroke-width="6" stroke-linecap="round"/>
          <line x1="564" y1="121" x2="592" y2="127" stroke="#141414" stroke-width="11" stroke-linecap="round"/>
          <path d="M628 140 L612 100" stroke="#a3a098" stroke-width="2"/><ellipse cx="609" cy="94" rx="11" ry="7" fill="#0a0a0a" stroke="url(#chrome)" stroke-width="2"/>

          <!-- HEADLIGHT -->
          <circle cx="680" cy="207" r="26" fill="#121212" stroke="url(#chrome)" stroke-width="4.5"/>
          <circle class="hlamp" cx="684" cy="207" r="17" fill="#2a2a26"/>
          <circle cx="678" cy="200" r="5" fill="rgba(255,255,255,.25)"/>

          <!-- PEGS, KICKSTAND -->
          <line x1="575" y1="372" x2="600" y2="372" stroke="#2a2927" stroke-width="7" stroke-linecap="round"/>
          <line x1="350" y1="384" x2="372" y2="384" stroke="#2a2927" stroke-width="6" stroke-linecap="round"/>
          <line x1="404" y1="380" x2="376" y2="419" stroke="#4d4b47" stroke-width="5" stroke-linecap="round"/>
        </g>
      </svg>
