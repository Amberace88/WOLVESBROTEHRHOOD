<svg class="bike-scene" viewBox="0 0 900 460" role="img" aria-label="{{gar.sceneAlt}}">
        <defs>
          <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ec"/><stop offset=".45" stop-color="#a3a098"/><stop offset=".55" stop-color="#5b5953"/><stop offset="1" stop-color="#d9d5cc"/></linearGradient>
          <linearGradient id="chromeH" x1="0" x2="1"><stop offset="0" stop-color="#6d6a64"/><stop offset=".5" stop-color="#f3efe6"/><stop offset="1" stop-color="#6d6a64"/></linearGradient>
          <radialGradient id="tankShine" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#3a3a3a"/><stop offset=".5" stop-color="#121212"/><stop offset="1" stop-color="#050505"/></radialGradient>
          <radialGradient id="floorLight" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="rgba(236,232,223,.16)"/><stop offset="1" stop-color="rgba(236,232,223,0)"/></radialGradient>
          <linearGradient id="fuel" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#4b2a6e"/><stop offset=".25" stop-color="#1f5d7a"/><stop offset=".45" stop-color="#2f7a4a"/><stop offset=".65" stop-color="#8a7a24"/><stop offset=".85" stop-color="#7a2f5a"/><stop offset="1" stop-color="#3a2a6e"/>
          </linearGradient>
          <radialGradient id="puddleMask" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
          <mask id="pm"><ellipse cx="455" cy="428" rx="170" ry="16" fill="url(#puddleMask)"/></mask>
          <radialGradient id="hl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe9"/><stop offset=".35" stop-color="rgba(255,248,220,.6)"/><stop offset="1" stop-color="rgba(255,248,220,0)"/></radialGradient>
        </defs>
        <!-- floor -->
        <ellipse cx="450" cy="425" rx="420" ry="34" fill="url(#floorLight)"/>
        <line x1="0" y1="420" x2="900" y2="420" stroke="#2c2b29" stroke-width="2"/>
        <!-- fuel puddle -->
        <g class="puddle" mask="url(#pm)">
          <ellipse cx="455" cy="428" rx="170" ry="16" fill="#0a0a0a"/>
          <ellipse class="sheen" cx="455" cy="428" rx="170" ry="16" fill="url(#fuel)" opacity=".55"/>
          <ellipse class="ripple" cx="452" cy="427" rx="4" ry="1" fill="none" stroke="#e8e4dc" stroke-width="1"/>
          <ellipse class="ripple r2" cx="452" cy="427" rx="4" ry="1" fill="none" stroke="#e8e4dc" stroke-width="1"/>
        </g>
        <circle class="drip" cx="452" cy="372" r="3.2" fill="#6b7a3a"/>
        <!-- headlight beam -->
        <path class="beam-hl" d="M664 196 L900 140 L900 290 Z" fill="url(#hl)" opacity="0"/>
        <g class="bike" id="bike">
          <!-- tires -->
          <g class="tire"><circle cx="200" cy="338" r="80" fill="none" stroke="#0e0e0e" stroke-width="26"/><circle cx="200" cy="338" r="80" fill="none" stroke="#1d1d1c" stroke-width="22" stroke-dasharray="5 7"/><circle cx="200" cy="338" r="93" fill="none" stroke="#3a3936" stroke-width="1.2"/></g>
          <g class="tire"><circle cx="700" cy="342" r="76" fill="none" stroke="#0e0e0e" stroke-width="22"/><circle cx="700" cy="342" r="76" fill="none" stroke="#1d1d1c" stroke-width="18" stroke-dasharray="5 7"/><circle cx="700" cy="342" r="87" fill="none" stroke="#3a3936" stroke-width="1.2"/></g>
          <!-- rims + spokes -->
          <g class="wheel rear" style="transform-origin:200px 338px">
            <circle cx="200" cy="338" r="62" fill="none" stroke="url(#chrome)" stroke-width="4"/>
            <g stroke="#a3a098" stroke-width="1.2" id="spokesR"></g>
            <circle cx="200" cy="338" r="16" fill="#0a0a0a" stroke="url(#chrome)" stroke-width="3"/>
            <circle cx="200" cy="338" r="34" fill="none" stroke="#5b5953" stroke-width="2" stroke-dasharray="3 6"/>
          </g>
          <g class="wheel front" style="transform-origin:700px 342px">
            <circle cx="700" cy="342" r="62" fill="none" stroke="url(#chrome)" stroke-width="4"/>
            <g stroke="#a3a098" stroke-width="1.2" id="spokesF"></g>
            <circle cx="700" cy="342" r="14" fill="#0a0a0a" stroke="url(#chrome)" stroke-width="3"/>
            <circle cx="700" cy="342" r="44" fill="none" stroke="#5b5953" stroke-width="1.5"/>
          </g>
          <!-- fenders -->
          <path d="M104 336 A 98 98 0 0 1 290 296 L276 308 A 84 84 0 0 0 120 338 Z" fill="url(#tankShine)" stroke="url(#chrome)" stroke-width="2"/>
          <path d="M630 318 A 90 90 0 0 1 782 322 L768 330 A 76 76 0 0 0 644 326 Z" fill="url(#tankShine)" stroke="url(#chrome)" stroke-width="2"/>
          <rect class="tail" x="96" y="318" width="16" height="8" rx="2" fill="#5a0b08"/>
          <!-- frame -->
          <g fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M268 222 L405 206 L612 172"/><path d="M612 176 C600 262 566 330 522 362 L360 362"/><path d="M268 222 L200 338 L360 356"/>
          </g>
          <g fill="none" stroke="#4d4b47" stroke-width="1.2"><path d="M268 222 L405 206 L612 172"/><path d="M268 222 L200 338 L360 356"/></g>
          <!-- shocks -->
          <path d="M262 236 L222 318" stroke="url(#chromeH)" stroke-width="7" stroke-linecap="round"/>
          <path d="M262 236 L222 318" stroke="#0a0a0a" stroke-width="2" stroke-dasharray="2 4"/>
          <!-- engine -->
          <g class="engine">
            <ellipse cx="430" cy="336" rx="74" ry="38" fill="#0b0b0b" stroke="url(#chrome)" stroke-width="2.5"/>
            <ellipse cx="322" cy="346" rx="48" ry="30" fill="#0f0f0f" stroke="url(#chrome)" stroke-width="2.5"/>
            <ellipse cx="322" cy="346" rx="30" ry="18" fill="none" stroke="#5b5953" stroke-width="1.5"/>
            <g transform="rotate(-28 400 300)">
              <rect x="372" y="222" width="56" height="86" rx="6" fill="#121212" stroke="url(#chrome)" stroke-width="2.5"/>
              <g stroke="#6d6a64" stroke-width="2"><line x1="366" y1="238" x2="434" y2="238"/><line x1="366" y1="250" x2="434" y2="250"/><line x1="366" y1="262" x2="434" y2="262"/><line x1="366" y1="274" x2="434" y2="274"/><line x1="366" y1="286" x2="434" y2="286"/><line x1="366" y1="298" x2="434" y2="298"/></g>
              <rect x="368" y="204" width="64" height="22" rx="5" fill="#181818" stroke="url(#chrome)" stroke-width="2.5"/>
            </g>
            <g transform="rotate(28 460 300)">
              <rect x="432" y="222" width="56" height="86" rx="6" fill="#121212" stroke="url(#chrome)" stroke-width="2.5"/>
              <g stroke="#6d6a64" stroke-width="2"><line x1="426" y1="238" x2="494" y2="238"/><line x1="426" y1="250" x2="494" y2="250"/><line x1="426" y1="262" x2="494" y2="262"/><line x1="426" y1="274" x2="494" y2="274"/><line x1="426" y1="286" x2="494" y2="286"/><line x1="426" y1="298" x2="494" y2="298"/></g>
              <rect x="428" y="204" width="64" height="22" rx="5" fill="#181818" stroke="url(#chrome)" stroke-width="2.5"/>
            </g>
            <circle cx="438" cy="270" r="26" fill="#141414" stroke="url(#chrome)" stroke-width="3"/>
            <circle cx="438" cy="270" r="15" fill="none" stroke="#a3a098" stroke-width="1.5"/>
            <image href="{{@base}}assets/img/mark-256.png" x="426" y="258" width="24" height="24" opacity=".85"/>
          </g>
          <!-- exhaust -->
          <g fill="none" stroke-linecap="round">
            <path d="M488 300 C522 372 470 396 380 398 L112 392" stroke="#0a0a0a" stroke-width="16"/>
            <path d="M488 300 C522 372 470 396 380 398 L112 392" stroke="url(#chrome)" stroke-width="12"/>
            <path d="M398 304 C402 362 380 380 300 382 L122 376" stroke="#0a0a0a" stroke-width="16"/>
            <path d="M398 304 C402 362 380 380 300 382 L122 376" stroke="url(#chrome)" stroke-width="12"/>
          </g>
          <!-- tank + seat -->
          <path d="M400 198 C410 150 562 136 608 176 C592 202 470 214 400 198 Z" fill="url(#tankShine)" stroke="url(#chrome)" stroke-width="2"/>
          <path d="M470 160 C510 150 560 154 585 170" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="508" cy="160" r="6" fill="#0a0a0a" stroke="url(#chrome)" stroke-width="2"/>
          <path d="M266 212 C288 186 372 186 406 200 L402 216 C350 224 300 228 266 222 Z" fill="#0d0c0b" stroke="#3a3936" stroke-width="2"/>
          <!-- fork -->
          <g stroke-linecap="round"><line x1="604" y1="168" x2="694" y2="342" stroke="url(#chromeH)" stroke-width="9"/><line x1="618" y1="164" x2="708" y2="338" stroke="url(#chromeH)" stroke-width="7" opacity=".7"/></g>
          <!-- bars + mirror -->
          <path d="M608 152 C596 128 578 114 556 108" fill="none" stroke="url(#chrome)" stroke-width="6" stroke-linecap="round"/>
          <line x1="546" y1="102" x2="566" y2="114" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
          <path d="M600 140 L586 96" stroke="#a3a098" stroke-width="2"/><ellipse cx="584" cy="90" rx="10" ry="7" fill="#0a0a0a" stroke="url(#chrome)" stroke-width="2"/>
          <!-- headlight -->
          <circle cx="648" cy="196" r="24" fill="#111" stroke="url(#chrome)" stroke-width="4"/>
          <circle class="hlamp" cx="652" cy="196" r="15" fill="#2a2a26"/>
          <!-- kickstand -->
          <line x1="352" y1="364" x2="326" y2="418" stroke="#4d4b47" stroke-width="5" stroke-linecap="round"/>
        </g>
      </svg>