<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../src/assets/css/fonts.css">
<style>
@page{size:105mm 148mm;margin:0}
html,body{margin:0;background:#000}
.card{width:105mm;height:148mm;box-sizing:border-box;padding:10mm 10mm 8mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:#ECE8DF;font-family:'WB Sans',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.logo{width:46mm;height:auto}
.name{font-family:'WB Display';font-weight:800;font-size:15pt;letter-spacing:.08em;margin:2mm 0 0}
.since{font-size:8.5pt;color:#A6A299;margin:1mm 0 0}
.qr{background:#fff;padding:3mm;border-radius:2mm}
.qr img{display:block;width:44mm;height:44mm}
.url{font-family:'WB Display';font-weight:700;font-size:11pt;letter-spacing:.04em;margin:3mm 0 0}
.motto{font-family:'WB Book';font-style:italic;font-size:9pt;color:#A6A299;margin:0}
.top,.mid{display:flex;flex-direction:column;align-items:center;text-align:center}
</style></head><body><div class="card">
<div class="top"><img class="logo" src="../../src/assets/img/logo-600.png" alt="WBMC"><p class="name">WBMC</p><p class="since">Latvian Motorcycle Club from 1999</p></div>
<div class="mid"><div class="qr"><img src="wbmc-qr.svg" alt="QR"></div><p class="url">wolvesbrotherhoodmc.com</p></div>
<p class="motto">One brotherhood. One road. We are.</p>
</div></body></html>
