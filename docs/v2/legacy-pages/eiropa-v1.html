<!doctype html>
<html lang="{{@lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{meta.eiropa.title}}</title>
<meta name="description" content="{{meta.eiropa.desc}}">
{{@head}}
</head>
<body>
<a class="skip" href="#main">{{a11y.skip}}</a>
{{@nav}}
<main id="main" class="eu-page">
  <section class="eu-hero">
    <div class="wrap">
      <h1 class="rocker" data-rocker="{{eu.rocker}}">{{eu.title}}</h1>
      <p class="rocker-sub">{{eu.sub}}</p>
      <div class="eu-now">
        <div class="eu-live" id="euLive"></div>
        <div class="eu-next" id="euNext"></div>
      </div>
    </div>
  </section>

  <section class="wrap eu-body">
    <div class="eu-toolbar">
      <div class="chips" id="typeChips" role="group" aria-label="{{eu.filterType}}"></div>
      <div class="eu-filters">
        <label class="sr-only" for="euSearch">{{eu.search}}</label>
        <input id="euSearch" type="search" placeholder="{{eu.searchPh}}">
        <label class="sr-only" for="euCountry">{{eu.country}}</label>
        <select id="euCountry"></select>
        <label class="sr-only" for="euSort">{{eu.sort}}</label>
        <select id="euSort"><option value="date">{{eu.sortDate}}</option><option value="dist">{{eu.sortDist}}</option></select>
        <label class="toggle"><input type="checkbox" id="euNear"><span>{{eu.near}}</span></label>
        <label class="toggle"><input type="checkbox" id="euMine"><span>{{eu.mine}}</span></label>
  <div class="seg views" role="tablist" aria-label="{{eu.view}}">
        <button type="button" class="on" data-view="list" role="tab" aria-selected="true">{{eu.vList}}</button>
        <button type="button" data-view="map" role="tab" aria-selected="false">{{eu.vMap}}</button>
        <button type="button" data-view="time" role="tab" aria-selected="false">{{eu.vTime}}</button>
      </div>
      </div>

    </div>
    <p class="eu-count muted" id="euCount" aria-live="polite"></p>

    <div id="vList" class="eu-list"></div>
    <div id="vMap" class="eu-map" hidden><div id="euMap"></div></div>
    <div id="vTime" class="eu-time" hidden></div>

    <p class="eu-note muted">{{eu.note}}</p>
  </section>
</main>
{{@footer}}
<script src="{{@base}}assets/vendor/leaflet/leaflet.js" defer></script>
<script src="{{@base}}assets/js/data.js" defer></script>
<script src="{{@base}}assets/js/eu-events.js" defer></script>
<script src="{{@base}}assets/js/common.js" defer></script>
<script src="{{@base}}assets/js/eu.js" defer></script>
</body>
</html>
